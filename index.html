<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<title>Kim Sun</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
button,input{font:inherit} #login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);padding:34px;border:1px solid #334155;border-radius:22px;background:#172033;box-shadow:0 25px 70px #0008}
.logo{width:72px;height:72px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:#f4b942;color:#151515;font-weight:900;font-size:26px}
h1{text-align:center;margin:0 0 8px} .sub{text-align:center;color:#b8c3d5;margin:0 0 24px;line-height:1.6}
label{display:block;margin-bottom:8px;font-weight:700} .pw{display:flex;gap:8px}
input{width:100%;height:50px;border:1px solid #475569;border-radius:12px;padding:0 14px;background:#fff;color:#111;outline:none}
.primary{width:100%;height:50px;margin-top:14px;border:0;border-radius:12px;background:#f4b942;color:#171717;font-weight:800;cursor:pointer}
.msg{min-height:22px;margin-top:13px;text-align:center;color:#fca5a5}
#app{display:none;min-height:100vh;background:#f4f6f9;color:#172033}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 5%;background:#101827;color:#fff}
header strong{font-size:22px} .logout{border:0;border-radius:10px;padding:10px 15px;background:#f4b942;font-weight:800;cursor:pointer}
main{width:min(1100px,calc(100% - 30px));margin:auto;padding:35px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.item{padding:24px;border:1px solid #d9e0e9;border-radius:18px;background:#fff;box-shadow:0 10px 30px #0f172a12}
.item .ico{font-size:32px} .item h2{font-size:19px;line-height:1.4;min-height:54px}
.item button{width:100%;border:0;border-radius:10px;padding:12px;background:#173f68;color:#fff;font-weight:800;cursor:pointer}
#viewer{display:none;position:fixed;inset:0;z-index:20;background:#fff}
.viewerbar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 14px;background:#101827;color:#fff}
.viewerbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.viewerbar button{border:0;border-radius:9px;padding:9px 13px;background:#f4b942;font-weight:800;cursor:pointer}
iframe{width:100%;height:calc(100vh - 58px);border:0;background:#fff}
@media(max-width:800px){.grid{grid-template-columns:1fr} .item h2{min-height:0}}
</style>
</head>
<body>
<section id="login">
  <form class="card" id="form" autocomplete="off">
    <div class="logo">KS</div>
    <h1>Kim Sun</h1>
    <p class="sub">Nhập mật khẩu để xem nội dung riêng tư.</p>
    <label for="password">Mật khẩu</label>
    <div class="pw"><input id="password" type="password" required autocomplete="current-password"></div>
    <button class="primary" id="submit" type="submit">Đăng nhập</button>
    <div class="msg" id="msg"></div>
  </form>
</section>

<section id="app">
  <header><strong>Kim Sun</strong><button class="logout" id="logout">Đăng xuất</button></header>
  <main><h1 style="text-align:left">Thư viện nội dung</h1><p>Chọn một tài liệu để xem.</p><div class="grid" id="grid"></div></main>
</section>

<section id="viewer">
  <div class="viewerbar">
    <span id="viewerTitle"></span>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="openPdfTab" type="button" style="display:none">Mở tab mới</button>
      <button id="closeViewer" type="button">Đóng</button>
    </div>
  </div>
  <iframe id="frame" title="Trình xem tài liệu"></iframe>
</section>

<script>
const MANIFEST="6228ecd2436810ca844cde6a.dat";
const $=s=>document.querySelector(s);
let sessionPassword="";
let manifest=[];
let activeObjectUrl="";

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}

async function decryptPayloadBytes(payload,password){
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey(
    "raw",enc.encode(password),{name:"PBKDF2"},false,["deriveKey"]
  );
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(payload.s),iterations:310000,hash:"SHA-256"},
    keyMaterial,{name:"AES-GCM",length:256},false,["decrypt"]
  );
  const plain=await crypto.subtle.decrypt(
    {name:"AES-GCM",iv:b64(payload.i)},key,b64(payload.d)
  );
  return new Uint8Array(plain);
}

async function loadEncryptedBytes(name,password){
  const res=await fetch(name,{cache:"no-store"});
  if(!res.ok) throw new Error("Không tải được dữ liệu");
  return decryptPayloadBytes(await res.json(),password);
}

async function loadEncryptedText(name,password){
  const bytes=await loadEncryptedBytes(name,password);
  return new TextDecoder().decode(bytes);
}

function prepareDocumentHtml(html){
  const navigationFix = `
<script>
(function () {
  function decodeTarget(value) {
    try { return decodeURIComponent(value); }
    catch (e) { return value; }
  }

  document.addEventListener("click", function (event) {
    const link = event.target.closest("a[href]");
    if (!link) return;
    const href = link.getAttribute("href") || "";

    if (href.charAt(0) === "#") {
      event.preventDefault();
      event.stopPropagation();

      const id = decodeTarget(href.slice(1));
      if (!id) {
        document.documentElement.scrollTo({top:0,behavior:"smooth"});
        return;
      }

      const target =
        document.getElementById(id) ||
        document.querySelector('[name="' + CSS.escape(id) + '"]');

      if (target) {
        target.scrollIntoView({behavior:"smooth",block:"start"});
        try { history.replaceState(null,"","#"+encodeURIComponent(id)); }
        catch (e) {}
      }
    }
  }, true);

  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll('a[target="_top"],a[target="_parent"]').forEach(function (link) {
      link.removeAttribute("target");
    });
  });
})();
<\/script>`;

  if (/<\/body\s*>/i.test(html)) {
    return html.replace(/<\/body\s*>/i,navigationFix+"</body>");
  }
  return html+navigationFix;
}

function clearViewerContent(){
  $("#openPdfTab").style.display="none";
  $("#openPdfTab").onclick=null;

  $("#frame").removeAttribute("src");
  $("#frame").srcdoc="";

  if(activeObjectUrl){
    URL.revokeObjectURL(activeObjectUrl);
    activeObjectUrl="";
  }
}

function render(){
  $("#grid").innerHTML="";
  manifest.forEach((x,i)=>{
    const el=document.createElement("article");
    el.className="item";
    const icon=x.type==="pdf"?"📕":"📘";
    const buttonText=x.type==="pdf"?"Xem PDF":"Mở tài liệu";
    el.innerHTML=`<div class="ico">${icon}</div><h2></h2><button type="button">${buttonText}</button>`;
    el.querySelector("h2").textContent=x.title;
    el.querySelector("button").onclick=()=>openDoc(i);
    $("#grid").appendChild(el);
  });
}

async function openDoc(i){
  const x=manifest[i];
  clearViewerContent();
  $("#viewerTitle").textContent=x.title;
  $("#viewer").style.display="block";
  $("#frame").srcdoc="<p style='font-family:Arial;padding:30px'>Đang giải mã nội dung...</p>";

  try{
    if(x.type==="pdf"){
      const bytes=await loadEncryptedBytes(x.file,sessionPassword);
      const blob=new Blob([bytes],{type:"application/pdf"});
      activeObjectUrl=URL.createObjectURL(blob);

      const pdfUrl=activeObjectUrl+"#toolbar=1&navpanes=1&view=FitH";
      $("#frame").srcdoc="";
      $("#frame").src=pdfUrl;

      $("#openPdfTab").style.display="inline-block";
      $("#openPdfTab").onclick=()=>{
        window.open(pdfUrl,"_blank","noopener,noreferrer");
      };
    }else{
      const documentHtml=await loadEncryptedText(x.file,sessionPassword);
      $("#frame").srcdoc=prepareDocumentHtml(documentHtml);
    }
  }catch(e){
    $("#frame").srcdoc="<p style='font-family:Arial;padding:30px;color:#b91c1c'>Không thể mở tài liệu.</p>";
  }
}

$("#form").addEventListener("submit",async e=>{
  e.preventDefault();
  const pass=$("#password").value;
  $("#submit").disabled=true;
  $("#submit").textContent="Đang kiểm tra...";
  $("#msg").textContent="";

  try{
    manifest=JSON.parse(await loadEncryptedText(MANIFEST,pass));
    sessionPassword=pass;
    render();
    $("#login").style.display="none";
    $("#app").style.display="block";
    $("#password").value="";
  }catch(err){
    $("#msg").textContent="Mật khẩu không chính xác.";
    $("#password").value="";
    $("#password").focus();
  }finally{
    $("#submit").disabled=false;
    $("#submit").textContent="Đăng nhập";
  }
});

$("#closeViewer").onclick=()=>{
  clearViewerContent();
  $("#viewer").style.display="none";
};

$("#logout").onclick=()=>{
  clearViewerContent();
  sessionPassword="";
  manifest=[];
  $("#grid").innerHTML="";
  $("#app").style.display="none";
  $("#viewer").style.display="none";
  $("#login").style.display="grid";
  $("#password").focus();
};

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#viewer").style.display==="block"){
    $("#closeViewer").click();
  }
});
</script>
</body>
</html>
